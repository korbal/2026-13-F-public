<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson T2 · Make, move, run</title>
<style>
:root{
  --accent:#2f6fde; --ink:#1c2430; --muted:#6b7280; --line:#e3e6ea; --soft:#f6f7f9; --ok:#2e9e5b; --warn:#b45309; --bad:#b91c1c; --amber:#f2b04a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--soft);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono,code,kbd{font-family:ui-monospace,Consolas,"Cascadia Code","Liberation Mono",monospace}
button,input,textarea{font:inherit}
.btn{border:1px solid #d3d7dd;background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}

/* ===== slides ===== */
#primer{position:fixed;inset:0;z-index:20;background:var(--soft);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.slide{background:#fff;border:1px solid var(--line);border-radius:16px;max-width:860px;width:100%;padding:26px 34px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:auto 0}
.slide .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slide h2{font-size:28px;margin:4px 0 16px}
.slide .art{background:#fbfcfd;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
.slide .art svg{width:100%;min-width:520px;height:auto;display:block}
.slide p{font-size:17px;line-height:1.65;margin:14px 0 0}
.slide .say{margin-top:16px;background:#1c2430;color:#e8ecf1;border-radius:10px;padding:12px 14px;font-size:14px}
.slide .nav{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.pdots{display:flex;gap:6px;margin-right:auto}
.pdot{width:9px;height:9px;border-radius:50%;background:#dfe3e8;cursor:pointer}
.pdot.cur{background:var(--accent)}
.slide .keys{font-size:12px;color:var(--muted);margin-top:10px}

/* ===== practice: task strip ===== */
#practice{height:100%;display:flex;flex-direction:column;min-height:0}
.strip{flex:none;background:var(--soft);border-bottom:1px solid #c9ced6;padding:10px 16px;display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:20px;align-items:start}
.who .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.who .ltitle{font-size:17px;font-weight:800;margin:1px 0 6px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#dfe3e8;cursor:pointer;border:0;padding:0}
.dot.done{background:var(--accent)} .dot.used{background:var(--amber)} .dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.links{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.links a{color:var(--muted);cursor:pointer;text-decoration:underline}
.do .sentence{font-size:17px;line-height:1.45}
.do .sub{font-size:14px;color:var(--muted);margin-top:3px}
.do code{background:#e9edf2;border-radius:4px;padding:0 4px;font-size:.88em;color:var(--ink)}
.do kbd,.slide kbd{font-size:12px;border:1px solid #cfd4da;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff;color:var(--ink)}
.result{margin-top:6px;font-size:14px}
.result .no{color:var(--bad);font-weight:700}
.result .yes{color:var(--ok);font-weight:700}
.result .dim{color:var(--muted)}
.result code{background:#e9edf2;border-radius:4px;padding:0 4px;font-size:.88em}
.hints{margin-top:6px;background:#fff8e6;border:1px solid #f5e2b0;border-radius:8px;padding:6px 10px;font-size:14px}
.hints div+div{margin-top:4px}
.hints b{color:var(--warn)}
.hints code{background:#fff;border-radius:4px;padding:0 4px;font-size:.88em}
.note{margin-top:6px;font-size:13px;color:var(--warn)}
.actions{display:flex;gap:8px;align-items:center;padding-top:4px;flex-wrap:wrap}
.predict{display:inline-block;border:2px dashed #7c3aed;border-radius:6px;padding:0 6px;margin:0 6px 2px 0;color:#6d28d9;font-weight:700;background:#faf5ff}

/* ===== practice: Explorer beside the terminal ===== */
.work{flex:1;display:grid;grid-template-columns:minmax(240px,30fr) 70fr;min-height:0}
.work.noexp{grid-template-columns:1fr}
.explorer{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px 14px;font-size:14px}
.explorer h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.explorer .addr{font:13px ui-monospace,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-bottom:8px;word-break:break-all}
.trow{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:5px;white-space:nowrap}
.trow .ic{width:16px;text-align:center;flex:none}
.trow.dir .nm{font-weight:600}
.trow.file{color:#374151}
.trow.here{background:#fef3c7;outline:2px solid #f2b04a}
.trow .pin{font-size:12px;font-weight:700;color:var(--warn);margin-left:6px}
.trow.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#bbf7d0}100%{background:transparent}}
.explorer .off{color:var(--muted);font-size:13px;margin-top:8px}
.right{display:flex;flex-direction:column;min-height:0;min-width:0}
.answer{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer label{font-weight:700}
.answer input{border:1px solid #c9ced6;border-radius:6px;padding:6px 8px;min-width:260px;font-family:ui-monospace,Consolas,monospace}
.answer textarea{border:1px solid #c9ced6;border-radius:6px;padding:6px 8px;width:100%;min-height:160px;font:13px ui-monospace,Consolas,monospace}
.solbox{flex:none;border-bottom:2px solid #f2b04a;background:#fffaf0;padding:8px 14px;font-size:14px}
.solbox h4{margin:0 0 4px;color:var(--warn);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.solbox pre{margin:4px 0 0;white-space:pre-wrap;font:12.5px ui-monospace,Consolas,monospace;background:#fff;border:1px solid #f5e2b0;border-radius:6px;padding:6px 8px;max-height:200px;overflow:auto}
.solbox code{display:inline-block;background:#fff;border:1px solid #f5e2b0;border-radius:4px;padding:1px 6px;margin:2px 4px 2px 0;font-size:13px}

/* the terminal: Git Bash colours */
.term{flex:1;min-height:240px;background:#0c0c0c;color:#d9d9d9;font:14px/1.42 ui-monospace,Consolas,"Cascadia Code","Liberation Mono",monospace;padding:10px 12px 40px;overflow:auto;cursor:text}
.term .tl{white-space:pre-wrap;word-break:break-word}
.term .pi{margin-top:8px}
.term .pu{color:#3fc33f} .term .pm{color:#c45ac4} .term .pp{color:#d7c43f}
.term .ls-d{color:#6f9eff;font-weight:700}
.term .dim{color:#8a8a8a}
.term .inl{display:flex}
.term .inl span{white-space:pre}
.term input{flex:1;min-width:40px;background:transparent;border:0;outline:none;color:#f2f2f2;font:inherit;padding:0;caret-color:#f2f2f2}
.term .tip{color:#8a8a8a;font-style:italic}
.termbar{flex:none;background:#1f1f1f;color:#bbb;font-size:12px;padding:4px 12px;display:flex;gap:14px;flex-wrap:wrap}
.termbar b{color:#eee}

@media (max-width:900px){
  .strip{grid-template-columns:1fr;gap:8px}
  .work{grid-template-columns:1fr;display:block;overflow:auto}
  .explorer{border-right:0;border-bottom:1px solid var(--line);max-height:260px}
  .term{min-height:320px}
  #practice{height:auto;min-height:100%}
  html,body{height:auto}
  .answer input{min-width:0;width:100%}
}
</style>
</head>
<body>
<div id="primer" class="hidden"></div>

<div id="practice">
  <div class="strip">
    <div class="who">
      <div class="kicker" id="t-kicker"></div>
      <div class="ltitle" id="t-title"></div>
      <div class="dots" id="dots"></div>
      <div class="links"><a href="../">Home</a><a id="l-slides">Slides</a><a id="l-again">Start task again</a><a id="l-reset">Reset all</a></div>
    </div>
    <div class="do">
      <div class="sentence" id="t-do"></div>
      <div class="sub" id="t-sub"></div>
      <div class="result" id="t-result"></div>
      <div class="hints hidden" id="t-hints"></div>
      <div class="note hidden" id="t-note"></div>
    </div>
    <div class="actions" id="t-actions"></div>
  </div>
  <div class="work" id="work">
    <div class="explorer" id="explorer"></div>
    <div class="right">
      <div class="solbox hidden" id="solbox"></div>
      <div class="answer hidden" id="answer"></div>
      <div class="term" id="term"></div>
      <div class="termbar" id="termbar"><span><b>Tab</b> finishes a name</span><span><b>↑</b> last command</span><span><b>Ctrl+C</b> stop / cancel</span><span><b>Select + right-click</b> copy</span><span><b>Right-click</b> paste</span><span><b>Ctrl+L</b> clear</span></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };
var PREP = /[?&]prep(=|&|$)/.test(location.search);
var LESSON = "Lesson T2 · Make, move, run";
var SHORT = "Lesson T2";

function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }

/* ====================================================================
   A small Git Bash: folders, files, and the commands a beginner needs.
   A folder is { d: { name: node } }, a file is { f: "text" }.
   ==================================================================== */

var HOME = "/h";
var USER = "you@school-pc";
var COMMANDS = ["cat", "cd", "clear", "code", "cp", "dir", "echo", "exit", "help", "ls", "mkdir", "mv", "node", "pwd", "rm", "rmdir", "touch"];

function rng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pick(R, arr){ return arr[Math.floor(R() * arr.length)]; }
function shuffle(R, arr){ arr = arr.slice(); for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

function isDir(n){ return !!(n && n.d); }
function parts(p){ return p.split("/").filter(Boolean); }
function parentOf(p){ var a = parts(p); a.pop(); return "/" + a.join("/"); }
function baseOf(p){ var a = parts(p); return a[a.length - 1] || "/"; }
function joinP(a, b){ return (a === "/" ? "" : a) + "/" + b; }
function keyIn(dir, name){ if (Object.prototype.hasOwnProperty.call(dir.d, name)) return name; var l = name.toLowerCase(); for (var k in dir.d) if (k.toLowerCase() === l) return k; return null; }

// Make every folder on the way; returns the last one.
function mkdirp(fs, p){ var n = fs; parts(p).forEach(function(x){ var k = keyIn(n, x); if (k === null) { n.d[x] = { d: {} }; k = x; } n = n.d[k]; }); return n; }
function put(fs, p, text){ mkdirp(fs, parentOf(p)).d[baseOf(p)] = { f: text || "" }; }

// Turn what was typed into an absolute path (it may not exist).
function absPath(cwd, p){
  var m = /^([a-zA-Z]):(\/.*)?$/.exec(p);
  if (m) p = "/" + m[1].toLowerCase() + (m[2] || "");
  var a = p.charAt(0) === "/" ? [] : parts(cwd);
  parts(p).forEach(function(x){ if (x === ".") return; if (x === "..") a.pop(); else a.push(x); });
  return "/" + a.join("/");
}
// Find a node; folder names are not case sensitive (Windows). Returns { node, path } with the real spelling.
function lookup(fs, abs){
  var n = fs, real = [];
  var ps = parts(abs);
  for (var i = 0; i < ps.length; i++) {
    if (!isDir(n)) return null;
    var k = keyIn(n, ps[i]); if (k === null) return null;
    real.push(k); n = n.d[k];
  }
  return { node: n, path: "/" + real.join("/") };
}
function exists(st, p){ return !!lookup(st.fs, p); }
function dirExists(st, p){ var r = lookup(st.fs, p); return !!(r && isDir(r.node)); }
function fileExists(st, p){ var r = lookup(st.fs, p); return !!(r && r.node && !isDir(r.node)); }

function shortPath(p){ if (p === HOME) return "~"; if (p.indexOf(HOME + "/") === 0) return "~" + p.slice(HOME.length); return p; }
// How Windows names the same place.
function winPath(p){
  var a = parts(p);
  if (a.length && /^[a-z]$/.test(a[0])) return a[0].toUpperCase() + ":\\" + a.slice(1).join("\\");
  return "C:\\Program Files\\Git" + (a.length ? "\\" + a.join("\\") : "");
}
function sortedKeys(dir){ return Object.keys(dir.d).sort(function(a, b){ var da = isDir(dir.d[a]), db = isDir(dir.d[b]); if (da !== db) return da ? -1 : 1; return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0; }); }
function lsKeys(dir, isRoot){ return Object.keys(dir.d).filter(function(k){ return !(isRoot && /^[a-z]$/.test(k)); }).sort(function(a, b){ var x = a.toLowerCase().replace(/[^a-z0-9]/g, ""), y = b.toLowerCase().replace(/[^a-z0-9]/g, ""); return x < y ? -1 : x > y ? 1 : 0; }); }
// ls quotes names with spaces or brackets, the way Git Bash shows them.
function lsName(k){ return /[\s()'"&;!$]/.test(k) ? "'" + k.replace(/'/g, "'\\''") + "'" : k; }
// For solutions shown to the student: single quotes when needed.
function q(k){ return /[\s()'"&;!$\\]/.test(k) ? "'" + k + "'" : k; }

// Split a command line like bash does: quotes, backslashes, ~.
function tokenize(line){
  var toks = [], cur = "", inTok = false, quote = null, tilde = false;
  for (var i = 0; i < line.length; i++) {
    var c = line.charAt(i);
    if (quote) {
      if (c === quote) quote = null;
      else if (quote === '"' && c === "\\" && /["\\$`]/.test(line.charAt(i + 1))) cur += line.charAt(++i);
      else cur += c;
      continue;
    }
    if (c === "'" || c === '"') { quote = c; inTok = true; continue; }
    if (c === "\\") { if (i + 1 < line.length) { cur += line.charAt(++i); inTok = true; } continue; }
    if (/\s/.test(c)) { if (inTok) { toks.push(tilde ? expandTilde(cur) : cur); cur = ""; inTok = false; tilde = false; } continue; }
    if (c === "(" || c === ")") return { err: "bash: syntax error near unexpected token `" + c + "'" };
    if (/[;&|<>]/.test(c)) return { err: "(This practice terminal runs one command at a time. Leave out the " + c + " and run them one by one.)", tip: true };
    if (!inTok && c === "~") tilde = true;
    cur += c; inTok = true;
  }
  if (quote) return { err: "(The " + quote + " quote is never closed, so bash would wait for more. Close it, then press Enter.)", tip: true };
  if (inTok) toks.push(tilde ? expandTilde(cur) : cur);
  return { toks: toks };
}
function expandTilde(s){ return s === "~" ? HOME : s.indexOf("~/") === 0 ? HOME + s.slice(1) : s; }

function newState(fs, cwd){ return { fs: fs, cwd: cwd, lines: [], hist: [], run: null, ncmd: 0, cds: 0, errs: 0, ran: [], answer: "", old: cwd }; }
function out(st, text, cls){ st.lines.push({ k: "o", s: text, c: cls || "" }); }
function outH(st, html){ st.lines.push({ k: "h", h: html }); }

// The programs a node file can be: a server keeps running, anything else prints and ends.
function nodeRun(st, file, abs){
  var r = lookup(st.fs, abs);
  if (!r) {
    out(st, "node:internal/modules/cjs/loader:1228\n  throw err;\n  ^\n\nError: Cannot find module '" + winPath(abs) + "'\n    at Module._resolveFilename (node:internal/modules/cjs/loader:1225:15)\n    at node:internal/main/run_main_module:28:49 {\n  code: 'MODULE_NOT_FOUND',\n  requireStack: []\n}\n\nNode.js v22.11.0");
    st.ran.push({ file: file, from: st.cwd, ok: false }); st.errs++; return;
  }
  if (isDir(r.node)) { out(st, "node:internal/modules/cjs/loader:1228\n  throw err;\n  ^\n\nError: Cannot find module '" + winPath(r.path) + "'\n  code: 'MODULE_NOT_FOUND'\n\nNode.js v22.11.0"); st.errs++; return; }
  var text = r.node.f, dirW = winPath(parentOf(r.path));
  st.ran.push({ file: r.path, from: st.cwd, ok: true });
  if (/app\.listen|\.listen\(/.test(text)) {
    out(st, "Listening on http://localhost:3000");
    out(st, "Stop it with Ctrl+C");
    st.run = { file: r.path, from: st.cwd }; return;
  }
  var lines = text.split("\n"), printed = false;
  lines.forEach(function(l){
    var m = /console\.log\((.*)\);?\s*$/.exec(l); if (!m) return;
    var s = m[1].split("+").map(function(p){ p = p.trim(); if (p === "__dirname") return dirW; var mm = /^["'`](.*)["'`]$/.exec(p); return mm ? mm[1] : p; }).join("");
    out(st, s); printed = true;
  });
  if (!printed && !text.trim()) { /* an empty file prints nothing */ }
}

function exec(st, line){
  var raw = line;
  st.lines.push({ k: "p", p: shortPath(st.cwd), s: raw });
  if (st.run) { st.lines.pop(); st.lines.push({ k: "o", s: raw, c: "" }); return; }
  if (!raw.trim()) return;
  st.hist.push(raw); if (st.hist.length > 60) st.hist.shift();
  st.ncmd++;
  var t = tokenize(raw);
  if (t.err) { out(st, t.err, t.tip ? "tip" : ""); st.errs++; return; }
  var a = t.toks, cmd = a[0], args = a.slice(1);
  var flags = "", names = [];
  args.forEach(function(x){ if (/^-[a-zA-Z]+$/.test(x)) flags += x.slice(1); else names.push(x); });
  var before = st.errs;
  switch (cmd) {
    case "pwd": out(st, st.cwd); break;
    case "cd": {
      if (names.length > 1) { out(st, "bash: cd: too many arguments"); st.errs++; break; }
      var target = names[0];
      if (target === undefined || target === "") target = HOME;
      if (target === "-") target = st.old;
      var abs = absPath(st.cwd, target), r = lookup(st.fs, abs);
      if (!r) { out(st, "bash: cd: " + names[0] + ": No such file or directory"); st.errs++; break; }
      if (!isDir(r.node)) { out(st, "bash: cd: " + names[0] + ": Not a directory"); st.errs++; break; }
      if (names[0] === "-") out(st, r.path);
      if (r.path !== st.cwd) { st.old = st.cwd; st.cwd = r.path; st.cds++; }
      break;
    }
    case "ls": case "dir": {
      var targets = names.length ? names : ["."], multi = targets.length > 1, isDirCmd = cmd === "dir";
      targets.forEach(function(nm, ti){
        var abs = absPath(st.cwd, nm), r = lookup(st.fs, abs);
        if (!r) { out(st, (isDirCmd ? "dir" : "ls") + ": cannot access '" + nm + "': No such file or directory"); st.errs++; return; }
        if (!isDir(r.node)) { out(st, lsName(nm)); return; }
        if (multi) out(st, (ti ? "\n" : "") + nm + ":");
        var keys = lsKeys(r.node, r.path === "/");
        if (/a/.test(flags)) keys = ["./", "../"].concat(keys);
        if (!keys.length) return;
        if (/l/.test(flags)) {
          out(st, "total " + keys.length * 4);
          outH(st, keys.map(function(k){ var d = k === "./" || k === "../" || isDir(r.node.d[k]); var nm2 = k === "./" ? "." : k === "../" ? ".." : lsName(k);
            return esc((d ? "drwxr-xr-x" : "-rw-r--r--") + " 1 you 197121 " + (d ? "   0" : " 412") + " Nov 30 08:12 ") + (d ? '<span class="ls-d">' + esc(nm2) + '</span>/' : esc(nm2)); }).join("\n"));
        } else {
          outH(st, keys.map(function(k){ if (k === "./" || k === "../") return '<span class="ls-d">' + k.slice(0, -1) + '</span>/'; var d = isDir(r.node.d[k]); return d ? '<span class="ls-d">' + esc(lsName(k)) + '</span>' + (isDirCmd ? "" : "/") : esc(lsName(k)); }).join("  "));
        }
      });
      break;
    }
    case "mkdir": {
      if (!names.length) { out(st, "mkdir: missing operand\nTry 'mkdir --help' for more information."); st.errs++; break; }
      names.forEach(function(nm){
        var abs = absPath(st.cwd, nm);
        if (/p/.test(flags)) { var ex = lookup(st.fs, abs); if (ex && !isDir(ex.node)) { out(st, "mkdir: cannot create directory '" + nm + "': File exists"); st.errs++; return; } mkdirp(st.fs, abs); return; }
        if (exists(st, abs)) { out(st, "mkdir: cannot create directory '" + nm + "': File exists"); st.errs++; return; }
        var par = lookup(st.fs, parentOf(abs));
        if (!par || !isDir(par.node)) { out(st, "mkdir: cannot create directory '" + nm + "': No such file or directory"); st.errs++; return; }
        par.node.d[baseOf(abs)] = { d: {} };
      });
      break;
    }
    case "touch": {
      if (!names.length) { out(st, "touch: missing file operand"); st.errs++; break; }
      names.forEach(function(nm){ var abs = absPath(st.cwd, nm); if (exists(st, abs)) return; var par = lookup(st.fs, parentOf(abs)); if (!par || !isDir(par.node)) { out(st, "touch: cannot touch '" + nm + "': No such file or directory"); st.errs++; return; } par.node.d[baseOf(abs)] = { f: "" }; });
      break;
    }

// Ctrl+C: stop what runs, or drop the line being typed.
function interrupt(st, typed){
  if (st.run) { out(st, "^C"); st.run = null; return; }

// Tab: finish the name, the way bash does (spaces get a backslash).
function bashEsc(s){ return s.replace(/([ ()'"\\&;!$])/g, "\\$1"); }
function complete(st, input){
  var start = 0, quote = null;
  for (var i = 0; i < input.length; i++) {
    var c = input.charAt(i);
    if (quote) { if (c === quote) quote = null; continue; }
    if (c === "'" || c === '"') { quote = c; continue; }
    if (c === "\\") { i++; continue; }
    if (c === " ") start = i + 1;
  }
  var rawWord = input.slice(start), isFirst = !input.slice(0, start).trim();
  var esc2 = rawWord.replace(/(^|[^\\])([()])/g, "$1\\$2"), t = tokenize(esc2);
  if (t.err) t = tokenize(esc2 + (esc2.indexOf("'") >= 0 ? "'" : '"'));
  var word = t.toks && t.toks.length ? t.toks[0] : "";
  if (isFirst && word.indexOf("/") < 0) {
    var cs = COMMANDS.filter(function(c){ return c.indexOf(word) === 0; });
    if (cs.length === 1) return { line: cs[0] + " " };
    if (cs.length > 1) return { list: cs };
    return null;
  }
  var cut = word.lastIndexOf("/"), dirPart = cut >= 0 ? word.slice(0, cut + 1) : "", base = cut >= 0 ? word.slice(cut + 1) : word;
  var r = lookup(st.fs, absPath(st.cwd, dirPart || "."));
  if (!r || !isDir(r.node)) return null;
  var keys = Object.keys(r.node.d), c1 = keys.filter(function(k){ return k.indexOf(base) === 0; });
  if (!c1.length) c1 = keys.filter(function(k){ return k.toLowerCase().indexOf(base.toLowerCase()) === 0; });
  if (!c1.length) return null;
  var shownDir = rawWord.charAt(0) === "~" ? "~" + dirPart.slice(HOME.length) : dirPart;
  var pre = function(s){ return shownDir.charAt(0) === "~" ? "~" + bashEsc(shownDir.slice(1)) + bashEsc(s) : bashEsc(shownDir + s); };
  if (c1.length === 1) return { line: input.slice(0, start) + pre(c1[0]) + (isDir(r.node.d[c1[0]]) ? "/" : " ") };
  var lcp = c1.reduce(function(a, b){ var j = 0; while (j < a.length && j < b.length && a.charAt(j) === b.charAt(j)) j++; return a.slice(0, j); });
  if (lcp.length > base.length) return { line: input.slice(0, start) + pre(lcp) };
  return { list: c1.sort().map(function(k){ return isDir(r.node.d[k]) ? k + "/" : k; }) };
}

// The commands that walk from one folder to another, one step at a time, looking around on the way.
function walkCmds(from, to){
  var a = parts(from), b = parts(to), i = 0, cmds = [];
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  for (var u = a.length; u > i; u--) { cmds.push("cd .."); cmds.push("ls"); }
  for (var d = i; d < b.length; d++) { cmds.push("cd " + q(b[d])); cmds.push("ls"); }
  if (cmds[cmds.length - 1] === "ls") cmds.pop();
  return ["pwd", "ls"].concat(cmds);
}
function relPath(from, to){
  var a = parts(from), b = parts(to), i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  var r = []; for (var u = a.length; u > i; u--) r.push("..");
  return r.concat(b.slice(i).map(function(x){ return x; })).join("/");
}

// What a student may write as a path: /h/13F, ~/13F, H:\13F, H:/13F, with or without the last slash.
function samePath(ans, p){
  var a = String(ans || "").trim().replace(/^["']|["']$/g, "").replace(/\\/g, "/").replace(/\/+$/, "");
  if (!a) return false;
  var m = /^([a-zA-Z]):(\/.*)?$/.exec(a); if (m) a = "/" + m[1].toLowerCase() + (m[2] || "");
  if (a === "~") a = HOME; else if (a.indexOf("~/") === 0) a = HOME + a.slice(1);
  return a.toLowerCase() === p.toLowerCase();
}

  }
  if (les.kind === "paste") box.innerHTML = '<label for="ans">Paste it here:</label><textarea id="ans" spellcheck="false">' + esc(st.answer || "") + '</textarea><button class="btn primary" id="ans-check">Check</button>';
  else box.innerHTML = '<label for="ans">Your answer:</label><input id="ans" autocomplete="off" spellcheck="false" value="' + esc(st.answer || "") + '"><button class="btn primary" id="ans-check">Check</button>';
  $("ans").addEventListener("input", function(e){ W().answer = e.target.value; save(); });
  $("ans").addEventListener("keydown", function(e){ if (e.key === "Enter" && (les.kind !== "paste" || e.ctrlKey)) { e.preventDefault(); checkNow(true); } });
  $("ans-check").onclick = function(){ checkNow(true); };
}

function renderSol(){
  var box = $("solbox"), les = L(), st = W();
  if (!(S.sol[S.i] && !S.done[S.i])) { box.classList.add("hidden"); return; }
  var s = les.solve(st);
  box.classList.remove("hidden");
  if (les.kind === "paste") { box.innerHTML = '<h4>What it looks like when it works</h4><pre>' + esc(s.answer) + '</pre>'; return; }
  if (les.kind === "choose") { box.innerHTML = '<h4>Solution</h4>' + esc(les.options[Number(s.answer)][0]); return; }
  box.innerHTML = '<h4>Solution: type it yourself (paste is off)</h4>' + s.cmds.map(function(c){ return c === "Ctrl+C" ? "<kbd>Ctrl</kbd>+<kbd>C</kbd>" : "<code>" + esc(c) + "</code>"; }).join(" ") + (s.answer !== undefined ? '<div>Then write <code>' + esc(s.answer) + '</code> in the box.</div>' : "");
}

function renderWork(focus){ var noTerm = !!L().noTerm; $("term").classList.toggle("hidden", noTerm); $("termbar").classList.toggle("hidden", noTerm); renderExplorer(); renderSol(); renderAnswer(); if (!noTerm) renderTerm(focus); }

$("term").addEventListener("mouseup", function(){ var sel = window.getSelection(); if (sel && String(sel).length) return; var i = $("tin"); if (i) i.focus({ preventScroll: true }); });
$("term").addEventListener("keydown", function(e){
  var inp = e.target; if (inp.id !== "tin") return;
  var st = W();
  if (e.key === "Enter") {
    e.preventDefault();
    var before = pathList(st.fs), line = inp.value;
    UI.typed = ""; UI.hi = 0;
    exec(st, line);
    var after = pathList(st.fs); flashPaths = {};
    after.forEach(function(p){ if (before.indexOf(p) < 0) flashPaths[p] = true; });
    afterCommand();
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault(); if (st.run) return;
    var r = complete(st, inp.value);
    if (!r) return;
    if (r.line !== undefined) { inp.value = r.line; UI.typed = r.line; return; }
    st.lines.push({ k: "p", p: shortPath(st.cwd), s: inp.value }); outH(st, r.list.map(function(x){ return /\/$/.test(x) ? '<span class="ls-d">' + esc(x.slice(0, -1)) + '</span>/' : esc(x); }).join("  "));
    UI.typed = inp.value; save(); renderTerm(); return;
  }
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault(); if (st.run) return;
    var hs = st.hist; if (!hs.length) return;
    UI.hi = Math.max(0, Math.min(hs.length, UI.hi + (e.key === "ArrowUp" ? 1 : -1)));
    inp.value = UI.hi ? hs[hs.length - UI.hi] : ""; UI.typed = inp.value; return;
  }
  if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
    if (window.getSelection && String(window.getSelection()).length && !st.run) return;
    e.preventDefault(); interrupt(st, inp.value); UI.typed = ""; afterCommand(); return;
  }
  if (e.ctrlKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); st.lines = []; UI.typed = inp.value; save(); renderTerm(); return; }
});
// Right-click: copy what is selected, or paste when nothing is (as in VS Code on Windows).
$("term").addEventListener("contextmenu", function(e){
  var sel = window.getSelection ? String(window.getSelection()) : "";
  if (sel) {
    e.preventDefault();
    var done = function(){ UI.note = "Copied. Right-click again (or Ctrl+V) to paste it."; renderStripNote(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(sel).then(done, function(){ try { document.execCommand("copy"); done(); } catch (x) {} });
    else { try { document.execCommand("copy"); done(); } catch (x) {} }
    window.getSelection().removeAllRanges(); return;
  }
  var inp = $("tin"); if (!inp || !navigator.clipboard || !navigator.clipboard.readText) return;
  e.preventDefault();
  if (S.sol[S.i] && !S.done[S.i]) { UI.note = "Paste is off while the solution is open. Type it: that is how it sticks."; renderStripNote(); return; }
  navigator.clipboard.readText().then(function(t){ t = String(t).split("\n")[0]; inp.value += t; UI.typed = inp.value; inp.focus(); }, function(){ UI.note = "The browser didn't allow pasting this way. Ctrl+V works here."; renderStripNote(); });
});
$("term").addEventListener("input", function(e){ if (e.target.id === "tin") UI.typed = e.target.value; });
$("term").addEventListener("paste", function(e){
  if (S.sol[S.i] && !S.done[S.i]) { e.preventDefault(); UI.note = "Paste is off while the solution is open. Type it: that is how it sticks."; renderStripNote(); }
});

// After every command: done yet? (No red until they press Check.)
function afterCommand(){
  var idx = S.i, les = LESSONS[idx], st = W();
  if (st.lines.length > 400) st.lines = st.lines.slice(-300);
  if (!boxKind(les) && !S.done[idx] && !les.check(st)) markDone(idx);
  else if (S.checked[idx] && !S.done[idx]) S.msg[idx] = les.check(st);
  save(); renderDots(); renderStrip(); renderWork();
}
function markDone(idx){
  var les = LESSONS[idx];
  S.done[idx] = true; S.msg[idx] = ""; S.checked[idx] = true;
  if (S.sol[idx]) S.usedSol[idx] = true;
  S.sol[idx] = false;
  (les.alsoDone || []).forEach(function(j){ S.done[j] = true; });
}

function checkNow(fromAnswer){
  var idx = S.i, les = LESSONS[idx], st = W(), msg = les.check(st), key = JSON.stringify([st.cwd, st.answer, st.ncmd]);
  S.checked[idx] = true; S.msg[idx] = msg; UI.note = "";
  if (!msg) markDone(idx);
  else if (S.lastTried[idx] !== key) { S.lastTried[idx] = key; S.tries[idx] = (S.tries[idx] || 0) + 1; }
  save(); renderDots(); renderStrip(); renderWork(!fromAnswer);
  if (fromAnswer && $("ans")) $("ans").focus();
  else if (L().noTerm && $("ans")) $("ans").focus();
}

/* ====================================================================
   Task strip
   ==================================================================== */

function renderDots(){
  var h = "";
  for (var i = 0; i < N; i++) h += '<button class="dot' + (S.done[i] ? (S.usedSol[i] ? " used" : " done") : "") + (i === S.i ? " cur" : "") + '" data-i="' + i + '" title="Task ' + (i + 1) + ": " + esc(LESSONS[i].title) + (S.usedSol[i] ? " (solved with the solution)" : "") + '"></button>';
  $("dots").innerHTML = h;
}
$("dots").addEventListener("click", function(e){ var d = e.target.closest("[data-i]"); if (d) gotoTask(Number(d.dataset.i)); });

function hintState(){
  var les = L(), st = W(), shown = S.hints[S.i] || 0, tries = (S.tries[S.i] || 0) + (st.ncmd || 0), len = les.hints.length;
  var nextAt = len === 0 ? 6 * TRIES_PER_HINT / 2 : (shown + 1) * TRIES_PER_HINT;
  return { shown: shown, tries: tries, len: len, need: Math.max(0, nextAt - tries), solutionNext: shown >= len };
}
function button(label, cls, fn){ var b = document.createElement("button"); b.className = cls; b.textContent = label; b.onclick = fn; return b; }

function renderStrip(){
  var les = L(), st = W(), done = !!S.done[S.i], msg = S.msg[S.i], r = "";
  $("t-kicker").textContent = SHORT + " · Task " + (S.i + 1) + " of " + N + (les.boss ? " · Confident? Start here" : les.detective ? " · Detective" : les.extra ? " · Extra" : "") + (PREP ? (UI.prepView === "task" ? " · Prep: task" : " · Prep: solution") : "");
  $("t-title").textContent = les.title;
  $("t-do").innerHTML = les.do;
  $("t-sub").innerHTML = S.sol[S.i] && !done ? "The solution is above the terminal. Type it in yourself." : les.sub;
  if (!S.checked[S.i] && !done) r = '<span class="dim">' + (les.kind === "choose" ? "Pick one, then press <b>Check</b>." : les.kind === "paste" ? "Paste it in the box, then press <b>Check</b>." : les.kind === "answer" ? "Use the terminal, then write your answer and press <b>Check</b>." : "Type in the terminal and press Enter. It ticks itself when you get there.") + '</span>';
  else if (S.checked[S.i] && msg && !done) r = '<span class="no">✗ Not yet.</span> ' + msg;
  else if (done) r = '<span class="yes">✓ Done.</span> ' + les.after(st);
  $("t-result").innerHTML = r;
  var hs = hintState();
  if (hs.shown && les.hints.length) { $("t-hints").classList.remove("hidden"); $("t-hints").innerHTML = les.hints.slice(0, hs.shown).map(function(h, i){ return "<div><b>Hint " + (i + 1) + ":</b> " + h + "</div>"; }).join(""); }
  else $("t-hints").classList.add("hidden");
  var act = $("t-actions"); act.innerHTML = "";
  if (PREP) {
    act.appendChild(button("← Prev", "btn", function(){ gotoTask(S.i - 1); }));
    act.appendChild(button(UI.prepView === "task" ? "Show solution" : "Show task", "btn", togglePrep));
    act.appendChild(button("Next →", "btn primary", function(){ gotoTask(S.i + 1); }));
    return renderStripNote();
  }
  if (!boxKind(les) && !done) act.appendChild(button("Check", "btn primary", function(){ checkNow(false); }));
  if (done) { if (S.i < N - 1) act.appendChild(button("Next task →", "btn primary", function(){ gotoTask(S.i + 1); })); }
  else if (!S.sol[S.i]) act.appendChild(button(hs.solutionNext ? "Show solution" : (hs.len ? "Stuck? Hint" : "Stuck?"), "btn", stuck));
  renderStripNote();
}
function renderStripNote(){ var n = $("t-note"); n.classList.toggle("hidden", !UI.note); n.textContent = UI.note; }
function stuck(){
  var hs = hintState();
  if (hs.need > 0) {
    UI.note = "Have a go first: type commands, look at what they print. " + hs.need + " more and " + (hs.solutionNext ? "the solution" : "a hint") + " unlocks.";
    renderStripNote(); return;
  }
  UI.note = "";
  if (hs.solutionNext) { S.sol[S.i] = true; save(); renderAll(); return; }
  S.hints[S.i] = hs.shown + 1; save(); renderStrip();
}

// Run the solution on a fresh start of the task (prep mode and tests).
function solvedState(i, seed){
  var st = startTask(i, seed), s = LESSONS[i].solve(st);
  (s.cmds || []).forEach(function(c){ if (c === "Ctrl+C") interrupt(st, ""); else exec(st, c); });
  if (s.answer !== undefined) st.answer = s.answer;
  return st;
}
function togglePrep(){
  UI.prepView = UI.prepView === "task" ? "solution" : "task";
  var seed = W().seed;
  S.work[S.i] = UI.prepView === "task" ? startTask(S.i, seed) : solvedState(S.i, seed);
  S.done[S.i] = false; S.checked[S.i] = false;
  if (UI.prepView === "solution") { if (!LESSONS[S.i].check(W())) { S.done[S.i] = true; S.checked[S.i] = true; } }
  renderAll();
}

/* ====================================================================
   Moving between tasks
   ==================================================================== */

function gotoTask(i){
  S.i = Math.max(0, Math.min(N - 1, i)); UI.note = ""; UI.typed = ""; UI.hi = 0; flashPaths = {};
  if (PREP) { UI.prepView = "solution"; S.work[S.i] = solvedState(S.i, 1000 + S.i); S.done[S.i] = !LESSONS[S.i].check(W()); S.checked[S.i] = true; renderAll(); return; }
  save(); renderAll();
}
function renderAll(){ renderDots(); renderStrip(); renderWork(); }
$("l-again").onclick = function(){
  if (!confirm("Start this task again? The folders get shuffled and your commands are cleared.")) return;
  S.work[S.i] = startTask(S.i); S.checked[S.i] = false; S.msg[S.i] = ""; S.sol[S.i] = false; save(); gotoTask(S.i);
};
$("l-reset").onclick = function(){
  if (!confirm("Start the whole lesson again from task 1? Your work and progress are cleared.")) return;
  S = fresh(); S.primerDone = true; save(); gotoTask(0);
};
$("l-slides").onclick = function(){ primerIdx = 0; showPrimer(true); };

document.addEventListener("keydown", function(e){
  if (!$("primer").classList.contains("hidden")) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { primerIdx = Math.max(0, Math.min(PRIMER.length - 1, primerIdx + (e.key === "ArrowRight" ? 1 : -1))); renderPrimer(); }
    if (e.key === "N" && e.shiftKey) { showSay = !showSay; renderPrimer(); }
    return;
  }
  if (PREP && e.altKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); gotoTask(S.i + (e.key === "ArrowRight" ? 1 : -1)); }
});

/* ====================================================================
   Slides
   ==================================================================== */

function showPrimer(on){ $("primer").classList.toggle("hidden", !on); if (on) renderPrimer(); else { var i = $("tin"); if (i) i.focus(); } }
function renderPrimer(){
  var Pr = PRIMER[primerIdx], lastP = primerIdx === PRIMER.length - 1, dots = "";
  for (var i = 0; i < PRIMER.length; i++) dots += '<span class="pdot' + (i === primerIdx ? " cur" : "") + '" data-slide="' + i + '"></span>';
  $("primer").innerHTML = '<div class="slide">' +
    '<div class="kicker">' + LESSON + ' · ' + (primerIdx + 1) + ' of ' + PRIMER.length + '</div>' +
    '<h2>' + esc(Pr.title) + '</h2>' +
    '<div class="art">' + ART[Pr.art]() + '</div>' +
    '<p>' + Pr.body + '</p>' +
    (showSay ? '<div class="say"><b>Teacher:</b> ' + esc(Pr.say) + '</div>' : "") +
    '<div class="nav"><div class="pdots" id="pdots">' + dots + '</div>' +
    '<button class="btn" id="p-back"' + (primerIdx === 0 ? " disabled" : "") + '>← Back</button>' +
    '<button class="btn primary" id="p-next">' + (lastP ? "Let's go →" : "Next →") + '</button>' +
    (S.primerDone ? '<button class="btn" id="p-close">Close</button>' : "") + '</div>' +
    '<div class="keys">← → to move</div></div>';
  $("p-back").onclick = function(){ if (primerIdx > 0) { primerIdx--; renderPrimer(); } };
  $("p-next").onclick = function(){ if (!lastP) { primerIdx++; renderPrimer(); return; } S.primerDone = true; save(); showPrimer(false); };
  if ($("p-close")) $("p-close").onclick = function(){ showPrimer(false); };
  $("pdots").onclick = function(e){ var d = e.target.closest(".pdot"); if (d) { primerIdx = Number(d.dataset.slide); renderPrimer(); } };
}

// Test hook.
window.__T2 = { LESSONS: LESSONS, PRIMER: PRIMER, ART: ART, PREP: PREP, gotoTask: gotoTask, state: function(){ return S; },
  start: startTask, exec: exec, complete: complete, check: function(i, st){ return LESSONS[i].check(st); }, solved: solvedState, tokenize: tokenize, newState: newState, world: world, rng: rng };

document.title = LESSON;
showPrimer(!S.primerDone);
gotoTask(S.i);
})();
</script>
</body>
