<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson D4 · Your own app</title>
<style>
:root{
  --accent:#2f6fde; --ink:#1c2430; --muted:#6b7280; --line:#e3e6ea; --soft:#f6f7f9; --ok:#2e9e5b; --warn:#b45309; --bad:#b91c1c; --amber:#f2b04a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--soft);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono,code,kbd{font-family:ui-monospace,Consolas,"Cascadia Code","Liberation Mono",monospace}
button,input,textarea{font:inherit}
.btn{border:1px solid #d3d7dd;background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}

/* ===== slides ===== */
#primer{position:fixed;inset:0;z-index:20;background:var(--soft);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.slide{background:#fff;border:1px solid var(--line);border-radius:16px;max-width:860px;width:100%;padding:26px 34px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:auto 0}
.slide .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slide h2{font-size:28px;margin:4px 0 16px}
.slide .art{background:#fbfcfd;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
.slide .art svg{width:100%;min-width:520px;height:auto;display:block}
.slide p{font-size:17px;line-height:1.65;margin:14px 0 0}
.slide .say{margin-top:16px;background:#1c2430;color:#e8ecf1;border-radius:10px;padding:12px 14px;font-size:14px}
.slide .nav{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.pdots{display:flex;gap:6px;margin-right:auto}
.pdot{width:9px;height:9px;border-radius:50%;background:#dfe3e8;cursor:pointer}
.pdot.cur{background:var(--accent)}
.slide .keys{font-size:12px;color:var(--muted);margin-top:10px}

/* ===== practice: task strip ===== */
#practice{height:100%;display:flex;flex-direction:column;min-height:0}
.strip{flex:none;background:var(--soft);border-bottom:1px solid #c9ced6;padding:10px 16px;display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:20px;align-items:start}
.who .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.who .ltitle{font-size:17px;font-weight:800;margin:1px 0 6px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#dfe3e8;cursor:pointer;border:0;padding:0}
.dot.done{background:var(--accent)} .dot.used{background:var(--amber)} .dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.links{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.links a{color:var(--muted);cursor:pointer;text-decoration:underline}
.do .sentence{font-size:17px;line-height:1.45}
.do .sub{font-size:14px;color:var(--muted);margin-top:3px}
.do code{background:#e9edf2;border-radius:4px;padding:0 4px;font-size:.88em;color:var(--ink)}
.do kbd{font-size:12px;border:1px solid #cfd4da;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff;color:var(--ink)}
.result{margin-top:6px;font-size:14px}
.result .no{color:var(--bad);font-weight:700}
.result .yes{color:var(--ok);font-weight:700}
.result .dim{color:var(--muted)}
.hints{margin-top:6px;background:#fff8e6;border:1px solid #f5e2b0;border-radius:8px;padding:6px 10px;font-size:14px}
.hints div+div{margin-top:4px}
.hints b{color:var(--warn)}
.note{margin-top:6px;font-size:13px;color:var(--warn)}
.actions{display:flex;gap:8px;align-items:center;padding-top:4px;flex-wrap:wrap}

/* ===== practice: the story beside the work ===== */
.work{flex:1;display:grid;grid-template-columns:minmax(280px,34fr) 66fr;min-height:0}
.storyp{background:#fffdf5;border-right:1px solid #e8dfc0;overflow:auto;padding:16px 18px}
.storyp h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#8a6d1f}
.storyp h3+p,.storyp h3+ol{margin-top:4px}
.storyp * + h3{margin-top:16px}
.storyp p{margin:6px 0;font-size:15px;line-height:1.55}
.storyp ol{margin:6px 0;padding-left:22px;font-size:15px;line-height:1.55}
.storyp li{margin:4px 0}
.storyp .app{font-weight:700}
.storyp .vague{color:var(--bad)}
.storyp .dim{color:var(--muted)}
.storyp a{color:var(--accent)}
.ws{overflow:auto;padding:16px 18px 60px;background:#fff}

/* your story */
.steprow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px;max-width:760px}
.stepn{font-weight:700;padding-top:7px;text-align:right;color:var(--muted)}
textarea.step,input.appname,textarea.swap{width:100%;border:1px solid #d6d9de;border-radius:8px;padding:6px 10px;font-size:15px;line-height:1.45;background:#fffdf0;resize:vertical;outline:none}
textarea.step:focus,input.appname:focus,textarea.swap:focus{box-shadow:inset 0 0 0 2px #f2b04a;background:#fffbe6}
.appline{max-width:760px;margin-bottom:14px}
.appline label{display:block;font-weight:700;margin-bottom:4px}
.opt-tag{font-weight:400;color:var(--muted);font-size:13px}

/* tables they fill in */
.designer{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.tcard{border:1px solid #c7d2fe;border-radius:10px;background:#fff;padding:8px 10px 10px;max-width:100%;overflow-x:auto}
.tcard .thead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tname{font:700 15px ui-monospace,Consolas,monospace;color:var(--ink)}
input.tname-in{font:700 15px ui-monospace,Consolas,monospace;border:1px dashed #9aa5b8;border-radius:6px;padding:3px 6px;width:170px}
table.g{border-collapse:collapse}
table.g th{background:#eef3fc;border:1px solid #c7d2fe;padding:0;text-align:left;font:600 13px ui-monospace,Consolas,monospace;vertical-align:top}
table.g th .cn{display:block;padding:5px 8px}
table.g td{border:1px solid #d6d9de;padding:0}
table.g td.ro{padding:5px 8px;font-size:14px}
table.g input{border:0;padding:5px 8px;width:12ch;max-width:320px;background:transparent;font-size:14px;outline:none}
table.g th input{font:600 13px ui-monospace,Consolas,monospace}
table.g input:focus{background:#fffbe6;box-shadow:inset 0 0 0 2px #f2b04a}
table.g td input{background:#fffdf0}
table.g td.empty{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#f3f4f6 4px,#f3f4f6 8px);min-width:60px}
table.g td.side,table.g th.side{border:0;background:none;padding:0 0 0 4px;vertical-align:middle}
.x{border:0;background:none;color:#9aa0a6;cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px}
.x:hover{color:var(--bad);background:#fff0f0}
.add{border:1px dashed #9aa5b8;background:#fff;color:#475569;border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;margin-top:6px}
.add:hover{border-color:var(--accent);color:var(--accent)}
.add.big{padding:8px 14px;font-size:14px;align-self:center}
.colx{display:flex;align-items:center}

/* tick lists */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-width:760px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #d6d9de;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:15px;background:#fff}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:#eef3fc}
.opt input{margin-top:4px}
.opt code{background:#e9edf2;border-radius:4px;padding:0 4px;font-size:.9em}
.ws h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ws .honest{margin:0 0 10px;max-width:760px;font-size:14px;color:var(--warn)}
.ws .dimp{color:var(--muted);font-size:14px}
.swapbox{border:1px dashed #c9ced6;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#fbfcfd}
.swapbox label.lbl{font-weight:700}
.ro-tables{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.solbox{border:2px solid #f2b04a;background:#fffaf0;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.solbox h4{color:var(--warn)}
.solbox p{margin:0 0 8px;font-size:14px}

/* the live checklist */
.rules{border:1px solid var(--line);border-radius:10px;background:#fbfcfd;padding:8px 12px 10px;margin-bottom:14px}
.rules ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:3px 18px}
.rules li{color:var(--muted);font-size:14px}
.rules li::before{content:"○ ";font-weight:700}
.rules li.ok{color:var(--ok)}
.rules li.ok::before{content:"✓ "}
.rules code{background:#e9edf2;border-radius:4px;padding:0 4px;font-size:.9em;color:var(--ink)}

/* pointers: _id columns, and following them */
.follow{position:sticky;top:-16px;z-index:3;background:#fff;margin:-16px -18px 12px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px;min-height:20px}
.follow .dim{color:var(--muted)}
.follow .lead{color:var(--accent);font-weight:700}
.follow .broken{color:var(--bad);font-weight:700}
.follow code{background:#e9edf2;border-radius:4px;padding:0 4px;font-size:.92em}
table.g th.ptr{background:#fde68a;border-color:#f59e0b}
table.g td.ptr,table.g td.ptr input{background:#fef3c7}
table.g td.ptr{cursor:pointer}
table.g td.ptr.ro{font-weight:700}
table.g tr.hit td,table.g tr.hit td input{background:#dbeafe}
table.g td.from{box-shadow:inset 0 0 0 2px #f59e0b}
table.g td.broken,table.g td.broken input{background:#fde2e1;color:var(--bad);font-weight:700}

@media (max-width:900px){
  .strip{grid-template-columns:1fr;gap:8px}
  .work{grid-template-columns:1fr;display:block;overflow:auto}
  .storyp{border-right:0;border-bottom:1px solid #e8dfc0}
  #practice{height:auto;min-height:100%}
  html,body{height:auto}
}
</style>
</head>
<body>
<div id="primer" class="hidden"></div>

<div id="practice">
  <div class="strip">
    <div class="who">
      <div class="kicker" id="t-kicker"></div>
      <div class="ltitle" id="t-title"></div>
      <div class="dots" id="dots"></div>
      <div class="links"><a href="../">Home</a><a id="l-slides">Slides</a><a id="l-again">Start task again</a><a id="l-reset">Reset all</a></div>
    </div>
    <div class="do">
      <div class="sentence" id="t-do"></div>
      <div class="sub" id="t-sub"></div>
      <div class="result" id="t-result"></div>
      <div class="hints hidden" id="t-hints"></div>
      <div class="note hidden" id="t-note"></div>
    </div>
    <div class="actions" id="t-actions"></div>
  </div>
  <div class="work">
    <div class="storyp" id="story"></div>
    <div class="ws" id="ws"></div>
  </div>
</div>


<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };
// ?prep: the teacher flips through the tasks with a sample filled in. Nothing is saved.
var PREP = /[?&]prep(=|&|$)/.test(location.search);
var LESSON = "Lesson D4 · Your own app";

function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
// For comparing what they typed: no accents, lower case, single spaces.
function norm(s){ return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
function digits(s){ return String(s == null ? "" : s).replace(/\D/g, ""); }
function alnum(s){ return norm(s).replace(/[^a-z0-9]/g, ""); }

/* ====================================================================
   The left panel: how to write a story, and the given stories
   ==================================================================== */

var HOWTO =
  '<h3>How to write it</h3>' +
  '<p>Pick <b>one real use</b> of your app: one person, one day, from the first tap to the end. Write it as 5 to 8 steps.</p>' +
  '<p>Each step is one line with facts in it: <b>who</b> (a name), <b>what</b>, <b>when</b> (a day, a time), <b>how many</b>, <b>how much</b>.</p>' +
  '<h3>An example: Szelet, a pizza place</h3>' +
  '<ol>' +
  '<li>Friday 27 November, 19:40. Tóth Bence orders on his phone: 2 Sonkás pizzas, 2 990 Ft each.</li>' +
  '<li>He gives his phone number, +36 30 555 1234, and pays cash at the door.</li>' +
  '<li>20:05. The courier, Varga Zoltán, takes order 88.</li>' +
  '<li>20:20. Bence gets his pizzas. Order 88 is marked delivered.</li>' +
  '<li>Saturday 28 November, 18:30. Molnár Dóra orders 1 Margherita and 1 Négy sajtos.</li>' +
  '</ol>' +
  '<p class="vague">Too vague: <i>"The user orders food."</i> Who? What? When? How many?</p>';

var GYM =
  '<h3>A gym app</h3>' +
  '<p>A small gym wants an app where members log their workouts.</p>' +
  '<ol>' +
  '<li>Kovács Lili joins the gym\'s app with her email, lili.k@mail.hu.</li>' +
  '<li>Monday 7 December, 17:30. Lili starts a workout.</li>' +
  '<li>First exercise: Squat, 4 sets of 10 reps.</li>' +
  '<li>Then Push-up, 3 sets of 12 reps.</li>' +
  '<li>Then Lunge, 3 sets of 8 reps.</li>' +
  '<li>Wednesday 9 December, 18:00. Lili works out again: Squat, 5 sets of 5 reps.</li>' +
  '</ol>' +
  '<h3>The exercises</h3><p>Squat (legs) · Push-up (chest) · Lunge (legs)</p>';

var CLUB =
  '<h3>A club event app</h3>' +
  '<p>A photo club wants an app for its events and sign-ups.</p>' +
  '<ol>' +
  '<li>Szabó Márk joins the club\'s app. His email is mark.szabo@mail.hu.</li>' +
  '<li>Nagy Emma joins too: emma.nagy@mail.hu.</li>' +
  '<li>The club posts an event: Night photo walk, Friday 11 December, 18:00. It costs 1 500 Ft.</li>' +
  '<li>Márk signs up for the walk and pays.</li>' +
  '<li>Emma signs up too. She will pay later.</li>' +
  '<li>The club posts a second event: Portrait workshop, Saturday 19 December, 10:00, 2 000 Ft. Márk signs up. He has not paid yet.</li>' +
  '</ol>';

var DRAWDB_HOW =
  '<h3>drawDB in five steps</h3>' +
  '<ol>' +
  '<li>Open <a href="https://drawdb.vercel.app/" target="_blank" rel="noopener">drawdb.vercel.app</a> and start a new diagram. No login.</li>' +
  '<li>Add one table for each of yours, with the same name.</li>' +
  '<li>Give it the same columns (drawDB calls them fields).</li>' +
  '<li>For every <code>_id</code> column, drag from it to the <code>id</code> it points at: a line appears.</li>' +
  '<li>Move the boxes until the lines are easy to follow. Export it as a picture, so the whole team has it.</li>' +
  '</ol>' +
  '<p class="dim">Your tables are on the right, to copy from.</p>';

/* ====================================================================
   The slides: why first. One picture each.
   ==================================================================== */

var A = "#2f6fde", INK = "#1c2430", MUT = "#6b7280", LINE = "#e3e6ea", RED = "#b91c1c", GRN = "#15803d", AMB = "#b45309";
function T(x, y, s, o){ o = o || {}; return '<text x="' + x + '" y="' + y + '" font-size="' + (o.size || 12) + '"' + (o.bold ? ' font-weight="700"' : "") + (o.mono ? ' font-family="ui-monospace,Consolas,monospace"' : "") + ' fill="' + (o.fill || INK) + '"' + (o.anchor ? ' text-anchor="' + o.anchor + '"' : "") + ' xml:space="preserve">' + s + '</text>'; }
function R(x, y, w, h, o){ o = o || {}; return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (o.rx === undefined ? 8 : o.rx) + '" fill="' + (o.fill || "#fff") + '" stroke="' + (o.stroke || LINE) + '"' + (o.sw ? ' stroke-width="' + o.sw + '"' : "") + (o.dash ? ' stroke-dasharray="5 4"' : "") + '/>'; }
function ARROW(x1, y1, x2, y2, c, dash){ c = c || "#9aa0a6"; var a = Math.atan2(y2 - y1, x2 - x1), hx = x2 - 9 * Math.cos(a), hy = y2 - 9 * Math.sin(a);
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + hx + '" y2="' + hy + '" stroke="' + c + '" stroke-width="2"' + (dash ? ' stroke-dasharray="5 4"' : "") + '/>' +
    '<path d="M ' + x2 + ' ' + y2 + ' L ' + (hx + 5 * Math.sin(a)) + ' ' + (hy - 5 * Math.cos(a)) + ' L ' + (hx - 5 * Math.sin(a)) + ' ' + (hy + 5 * Math.cos(a)) + ' z" fill="' + c + '"/>'; }
function svg(h, label, inner){ return '<svg viewBox="0 0 640 ' + h + '" role="img" aria-label="' + esc(label) + '">' + inner + '</svg>'; }
// A line of text where some parts are facts: ["plain", ["fact"], "plain"].
function TS(x, y, parts, o){ o = o || {}; return '<text x="' + x + '" y="' + y + '" font-size="' + (o.size || 14) + '" fill="' + (o.fill || INK) + '" xml:space="preserve">' + parts.map(function(p){ return typeof p === "string" ? esc(p) : '<tspan font-weight="700" fill="' + (o.fact || A) + '">' + esc(p[0]) + '</tspan>'; }).join("") + '</text>'; }

// A table drawn as a grid. o.hl = ["row,col", ...] cells in yellow, o.hlRow = a whole row, o.hlCol = a column, o.fills = colours per cell, o.bad = red header.
function colWs(cols, rows){ return cols.map(function(c, j){ var m = c.length * 7.4; rows.forEach(function(r){ m = Math.max(m, String(r[j]).length * 6.9); }); return Math.round(m + 16); }); }
function gridW(cols, rows){ return colWs(cols, rows).reduce(function(a, b){ return a + b; }, 0); }
function colX(cols, rows, x, j){ var ws = colWs(cols, rows), cx = x; for (var k = 0; k < j; k++) cx += ws[k]; return cx; }
function colMid(cols, rows, x, j){ return colX(cols, rows, x, j) + colWs(cols, rows)[j] / 2; }
function GRID(x, y, name, cols, rows, o){
  o = o || {};
  var ws = colWs(cols, rows), s = "", hl = o.hl || [];
  if (name) s += T(x, y - 6, esc(name), { bold: true, mono: true, size: 13, fill: o.bad ? RED : INK });
  var cx = x;
  cols.forEach(function(c, j){
    s += R(cx, y, ws[j], 22, { rx: 0, fill: o.bad ? "#fff0f0" : "#eef3fc", stroke: o.bad ? "#f5b5b0" : "#c7d2fe" }) + T(cx + 7, y + 15, esc(c), { mono: true, bold: true, size: 11.5, fill: o.bad ? RED : INK });
    cx += ws[j];
  });
  rows.forEach(function(r, i){
    var yy = y + 22 + i * 22; cx = x;
    r.forEach(function(v, j){
      var key = i + "," + j, f = o.fills && o.fills[key], on = hl.indexOf(key) >= 0 || o.hlRow === i, col = o.hlCol === j;
      var fill = f || (on ? "#fef3c7" : col ? "#fef3c7" : v === "" ? "#f3f4f6" : "#fff");
      s += R(cx, yy, ws[j], 22, { rx: 0, fill: fill, stroke: "#d6d9de" }) + T(cx + 7, yy + 15, esc(v), { size: 12, bold: on || col || !!f, fill: INK });
      cx += ws[j];
    });
  });
  return s;
}
var BLUE = "#dbeafe", YEL = "#fef3c7";
function ROWFILL(n, c){ var f = {}; for (var j = 0; j < n; j++) f["0," + j] = c; return f; }

// A drawDB-style box: a coloured head with the table name, one line per column. Returns the svg and the y of each column's middle.
function BOX(x, y, w, name, fields){
  var s = R(x, y, w, 26 + fields.length * 22, { rx: 6, stroke: "#9fb3d9" }) + '<path d="M ' + x + ' ' + (y + 26) + ' V ' + (y + 6) + ' a 6 6 0 0 1 6 -6 H ' + (x + w - 6) + ' a 6 6 0 0 1 6 6 V ' + (y + 26) + ' z" fill="#2f6fde"/>';
  s += T(x + 10, y + 18, esc(name), { bold: true, mono: true, size: 12.5, fill: "#fff" });
  var mids = {};
  fields.forEach(function(f, i){
    var yy = y + 26 + i * 22;
    if (i) s += '<line x1="' + x + '" y1="' + yy + '" x2="' + (x + w) + '" y2="' + yy + '" stroke="' + LINE + '"/>';
    s += T(x + 10, yy + 15, esc(f), { mono: true, size: 12, bold: /_id$/.test(f) || f === "id", fill: /_id$/.test(f) ? AMB : INK });
    mids[f] = yy + 11;
  });
  return { s: s, y: mids };
}
function LINK(x1, y1, x2, y2){
  var d = 'M ' + x1 + ' ' + y1 + ' C ' + ((x1 + x2) / 2) + ' ' + y1 + ', ' + ((x1 + x2) / 2) + ' ' + y2 + ', ' + x2 + ' ' + y2;
  return '<path d="' + d + '" fill="none" stroke="' + AMB + '" stroke-width="2"/>' + '<circle cx="' + x1 + '" cy="' + y1 + '" r="3.5" fill="' + AMB + '"/><circle cx="' + x2 + '" cy="' + y2 + '" r="3.5" fill="' + AMB + '"/>';
}

var ART = {
  why: function(){
    var s = R(30, 14, 170, 204, { rx: 24, fill: "#fff", stroke: INK, sw: 2 });

}

/* --------------------------------------------------------------------

// A cell with several values: "2, 2, 1", "12 and 7", "3/4". Not a decimal like "4,5".
function splitParts(v){ return norm(v).split(/\s*(?:[,;\/+&]|\band\b|\bes\b)\s*/).filter(function(p){ return p; }); }
function isDecimal(v){ return /^\s*\d+,\d+\s*$/.test(String(v)); }

var NAMEC = /(^|[ _-])(name|nev|title|cim|megnevezes|username|nickname|becenev|fullname|full_name|first_?name|last_?name|vezeteknev|keresztnev)$/;

// The columns that name a row: name, title, …; else the first column with words in it.

    if (seen[n]) return "Two tables are called <b>" + esc(t.name) + "</b>. Each table needs a name of its own.";
    seen[n] = true;
    if (!t.cols.length) return "<b>" + esc(t.name) + "</b> has no columns.";
    var cs = {};

      if (cs[c]) return "<b>" + esc(t.name) + "</b> has two columns called <b>" + esc(t.cols[ci]) + "</b>. One fact, one column.";

      if (seen[v]) return "Two rows in <b>" + esc(t.name) + "</b> have id <b>" + esc(rows[r][idc]) + "</b>. An id is never used twice in the same table.";

/* ====================================================================
   State
   ==================================================================== */

var KEY = "db-your-own-app-v1";
var TRIES_PER_HINT = 2;
var N = LESSONS.length;
function fresh(){ return { i: 0, done: [], primerDone: false, tries: {}, lastTried: {}, hints: {}, sol: {}, usedSol: {}, work: {}, msg: {}, checked: {} }; }
function normalize(s){
  var f = fresh();
  if (!s || typeof s !== "object") return f;
  for (var k in f) if (s[k] === undefined || typeof s[k] !== typeof f[k]) s[k] = f[k];
  if (!Array.isArray(s.done)) s.done = [];
  s.i = Math.max(0, Math.min(N - 1, Number(s.i) || 0));
  return s;
}
var S = normalize((function(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } })());
if (PREP) { S = fresh(); S.primerDone = true; }
function save(){ if (PREP) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

var UI = { note: "", prepView: "solution", follow: null };
var primerIdx = 0, showSay = PREP;
function L(){ return LESSONS[S.i]; }
function W(){ if (!S.work[S.i]) S.work[S.i] = L().start(); return S.work[S.i]; }
// Their story and tables, for the later tasks. In ?prep, the samples.
function myStory(){ return PREP ? clone(SAMPLE_STORY) : (S.work[0] || storyStart()); }
function myTables(){
  var ts = PREP ? clone(SAMPLE_TABLES) : ((S.work[1] && S.work[1].tables) || []);
  return ts.filter(function(t){ return norm(t.name) || filledRows(t).length; }).map(function(t){ return TB(t.name, t.cols, filledRows(t)); });
}

/* ====================================================================
   The work area
   ==================================================================== */

// Every table on screen that pointers can lead to.
var VIEW = [];
function addView(t){ VIEW.push(t); return VIEW.length - 1; }

function roTable(t, live){
  var v = live ? addView(t) : -1;
  var h = '<div class="tcard"' + (v >= 0 ? ' data-v="' + v + '"' : "") + '><div class="thead"><span class="tname">' + esc(t.name) + '</span></div><table class="g"><tr>';
  t.cols.forEach(function(c){ h += '<th><span class="cn">' + esc(c) + '</span></th>'; });
  h += '</tr>';
  t.rows.forEach(function(r, ri){ h += '<tr>' + r.map(function(val, ci){ return '<td class="ro' + (val === "" ? " empty" : "") + '" data-r="' + ri + '" data-c="' + ci + '">' + esc(val) + '</td>'; }).join("") + '</tr>'; });
  return h + '</table></div>';
}
function roTables(ts, live){ return '<div class="ro-tables">' + ts.map(function(t){ return roTable(t, live); }).join("") + '</div>'; }

// Inputs grow with what is typed, so long values stay readable.
function wch(v, min){ return ' style="width:' + Math.max(min, String(v).length + 2) + 'ch"'; }
function gridHtml(ans){
  var h = '<div class="designer">';
  ans.tables.forEach(function(t, ti){
    h += '<div class="tcard" data-v="' + addView(t) + '"><div class="thead">';
    h += '<input class="tname-in" data-k="name" data-t="' + ti + '" value="' + esc(t.name) + '" placeholder="table name" aria-label="Table name">';
    h += '<button class="x" data-act="deltable" data-t="' + ti + '" title="Delete this table">✕ table</button>';
    h += '</div><table class="g"><tr>';
    t.cols.forEach(function(c, ci){
      h += '<th><div class="colx"><input data-k="col" data-t="' + ti + '" data-c="' + ci + '" value="' + esc(c) + '"' + wch(c, 10) + ' placeholder="column" aria-label="Column name"><button class="x" data-act="delcol" data-t="' + ti + '" data-c="' + ci + '" title="Delete this column">✕</button></div></th>';
    });
    h += '<th class="side"><button class="add" style="margin:0" data-act="addcol" data-t="' + ti + '">+ column</button></th></tr>';
    t.rows.forEach(function(r, ri){
      h += '<tr>';
      r.forEach(function(v, ci){
        h += '<td data-r="' + ri + '" data-c="' + ci + '"><input data-k="cell" data-t="' + ti + '" data-r="' + ri + '" data-c="' + ci + '" value="' + esc(v) + '"' + wch(v, 12) + ' aria-label="' + esc((t.cols[ci] || "cell") + ", row " + (ri + 1)) + '"></td>';
      });
      if (t.rows.length > 1) h += '<td class="side"><button class="x" data-act="delrow" data-t="' + ti + '" data-r="' + ri + '" title="Delete this row">✕</button></td>';
      h += '</tr>';
    });
    h += '</table><button class="add" data-act="addrow" data-t="' + ti + '">+ row</button></div>';
  });
  return h + '<button class="add big" data-act="addtable">+ table</button></div>';
}
function rulesHtml(){
  return '<div class="rules" id="rules"></div>';
}
function renderRules(){
  var box = $("rules"); if (!box) return;
  box.innerHTML = '<h4>The page checks</h4><ul>' + rules(W().tables).map(function(r){ return '<li class="' + (r.pass ? "ok" : "") + '" data-rule="' + r.key + '">' + r.label + '</li>'; }).join("") + '</ul>';
}

function storyHtml(ans){
  var h = '<div class="appline"><label for="app-name">Your app in one line <span class="opt-tag">(optional)</span></label><input id="app-name" class="appname" data-k="app" value="' + esc(ans.app || "") + '" placeholder="e.g. An app where students book a tutor for an hour"></div>';
  h += '<h4>Your story</h4>';
  for (var i = 0; i < NSTEPS; i++) {
    h += '<div class="steprow"><span class="stepn">' + (i + 1) + '</span><textarea class="step" rows="2" data-k="step" data-i="' + i + '" aria-label="Step ' + (i + 1) + '"' +
      (i === 0 ? ' placeholder="Who does what, and when?"' : i >= 5 ? ' placeholder="(optional)"' : "") + '>' + esc((ans.steps || [])[i] || "") + '</textarea></div>';
  }
  return h;
}
function myStoryPanel(){
  var st = myStory(), steps = (st.steps || []).filter(function(s){ return String(s || "").trim(); });
  var h = '<h3>Your story</h3>';
  if (norm(st.app)) h += '<p class="app">' + esc(st.app) + '</p>';
  if (!steps.length) return h + '<p class="dim">Your story is empty. Write it in task 1 first: the tables come from it.</p>';
  return h + '<ol>' + steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ol>';
}

function confirmHtml(les, ans){
  var h = '';
  if (les.link) h += '<p style="margin:0 0 12px"><a class="btn primary" href="' + les.link + '" target="_blank" rel="noopener">Open drawDB ↗</a></p>';
  h += '<h4>' + esc(les.optsTitle) + '</h4>';
  if (les.honest) h += '<p class="honest">' + les.honest + '</p>';
  h += '<div class="opts">';
  les.items.forEach(function(it, i){
    if (les.box === i) {
      h += '<div class="swapbox"><label class="lbl" for="swap-text">Steps that did not land on a row</label>' +
        '<textarea id="swap-text" class="swap" rows="3" data-k="swaptext" placeholder="Step 4: the rating has no row.">' + esc(ans.text || "") + '</textarea>' +
        '<label class="opt' + (ans.landed ? " on" : "") + '"><input type="checkbox" data-act="landed"' + (ans.landed ? " checked" : "") + '><span>Every step landed on a row: nothing to write.</span></label></div>';
    }

    h += '<label class="opt' + (on ? " on" : "") + '"><input type="checkbox" data-act="tick" data-i="' + i + '"' + (on ? " checked" : "") + '><span>' + it + '</span></label>';
  });
  h += '</div>';
  var ts = myTables();
  h += '<h4 style="margin-top:18px">Your tables</h4>';
  h += ts.length ? roTables(ts, true) : '<p class="dimp">Your tables are empty. Make them in task 2 first.</p>';

function solutionHtml(les){
  var h = '<div class="solbox"><h4>Solution: type it in yourself (paste is off)</h4>';
  if (les.solTitle) h += '<p>' + esc(les.solTitle) + '</p>';
  return h + roTables(les.solution.tables, false) + '</div>';
}

var FOLLOW_TIP = '<span class="dim">Click a yellow cell: the row it points at lights up.</span>';
function renderWork(){
  var les = L(), ans = W(), h = "";
  VIEW = [];
  if (les.kind === "story") h = storyHtml(ans);
  else {
    h = '<div class="follow" id="follow">' + FOLLOW_TIP + '</div>';
    if (S.sol[S.i] && !S.done[S.i] && les.solution && les.solution.tables) h += solutionHtml(les);
    if (les.kind === "design") h += rulesHtml() + gridHtml(ans);
    else h += confirmHtml(les, ans);
  }
  $("ws").innerHTML = h;
  renderRules();
  decorate();
}

// Colour every pointer column, and light up the row the chosen cell points at.
function decorate(){
  var cards = $("ws").querySelectorAll(".tcard[data-v]");
  var cellAt = function(card, r, c){ var tr = card.querySelectorAll("table.g tr")[r + 1]; return tr ? tr.querySelectorAll("td:not(.side)")[c] : null; };
  Array.prototype.forEach.call(cards, function(card){
    var vi = Number(card.dataset.v), t = VIEW[vi], trs = card.querySelectorAll("table.g tr"), ths = trs[0].querySelectorAll("th:not(.side)");
    t.cols.forEach(function(c, ci){
      var on = isPointer(t, vi, ci, VIEW);
      if (ths[ci]) ths[ci].classList.toggle("ptr", on);
      for (var r = 1; r < trs.length; r++) { var td = trs[r].querySelectorAll("td:not(.side)")[ci]; if (td) { td.classList.toggle("ptr", on); td.classList.remove("broken", "from"); } }
    });
    for (var r = 1; r < trs.length; r++) trs[r].classList.remove("hit");
  });
  var f = UI.follow, out = FOLLOW_TIP;
  if (f && VIEW[f.v] && VIEW[f.v].rows[f.r] && isPointer(VIEW[f.v], f.v, f.c, VIEW)) {
    var t = VIEW[f.v], col = t.cols[f.c], val = t.rows[f.r][f.c], tg = targetOf(col, VIEW), tt = VIEW[tg];
    var from = cellAt($("ws").querySelector('.tcard[data-v="' + f.v + '"]'), f.r, f.c);
    if (alnum(val)) {
      var hit = rowById(tt, tg, VIEW, val), card = $("ws").querySelector('.tcard[data-v="' + tg + '"]');
      if (hit >= 0) {
        if (card) card.querySelectorAll("table.g tr")[hit + 1].classList.add("hit");
        if (from) from.classList.add("from");
        out = '<span class="lead">' + esc(col) + ' ' + esc(val) + ' →</span> <code>' + esc(tt.name) + '</code>, the row with id ' + esc(val) + ': <b>' + esc(rowLabel(tt, tg, VIEW, hit)) + '</b>';
      } else {
        if (from) from.classList.add("broken");
        out = '<span class="broken">' + esc(col) + ' ' + esc(val) + ' → there is no row with id ' + esc(val) + ' in ' + esc(tt.name) + '.</span>';
      }
    } else out = '<span class="dim">' + esc(col) + ' is empty here: it points at nothing yet.</span>';
  }
  var box = $("follow"); if (box) box.innerHTML = out;
}
function followCell(td){
  var card = td.closest(".tcard[data-v]"); if (!card || td.dataset.r === undefined) return;
  UI.follow = { v: Number(card.dataset.v), r: Number(td.dataset.r), c: Number(td.dataset.c) };
  decorate();
}

$("ws").addEventListener("input", function(e){
  var el = e.target, k = el.dataset.k; if (!k) return;
  var ans = W();
  if (k === "step") { ans.steps[Number(el.dataset.i)] = el.value; save(); return; }
  if (k === "app") { ans.app = el.value; save(); return; }
  if (k === "swaptext") { ans.text = el.value; save(); return; }
  var t = ans.tables[Number(el.dataset.t)];
  if (k === "name") t.name = el.value;
  else if (k === "col") t.cols[Number(el.dataset.c)] = el.value;
  else if (k === "cell") t.rows[Number(el.dataset.r)][Number(el.dataset.c)] = el.value;
  if (k !== "name") el.style.width = Math.max(k === "col" ? 10 : 12, el.value.length + 2) + "ch";
  save(); renderRules(); decorate();
});
$("ws").addEventListener("focusin", function(e){ var td = e.target.closest("td[data-r]"); if (td) followCell(td); });
$("ws").addEventListener("change", function(e){
  var el = e.target, ans = W();
  if (el.dataset.act === "tick") { ans.ticks[Number(el.dataset.i)] = el.checked; save(); renderWork(); }
  else if (el.dataset.act === "landed") { ans.landed = el.checked; save(); renderWork(); }
});
$("ws").addEventListener("click", function(e){
  var td = e.target.closest("td.ro[data-r]"); if (td) { followCell(td); return; }
  var b = e.target.closest("button[data-act]"); if (!b) return;
  var a = b.dataset.act, ans = W(), t = ans.tables ? ans.tables[Number(b.dataset.t)] : null;
  if (a === "addtable") ans.tables.push(TB("", ["id", ""], [blank(2)]));
  else if (a === "deltable") ans.tables.splice(Number(b.dataset.t), 1);
  else if (a === "addcol") { t.cols.push(""); t.rows.forEach(function(r){ r.push(""); }); }
  else if (a === "delcol") { var c = Number(b.dataset.c); if (t.cols.length > 1) { t.cols.splice(c, 1); t.rows.forEach(function(r){ r.splice(c, 1); }); } }
  else if (a === "addrow") t.rows.push(blank(t.cols.length));
  else if (a === "delrow") { if (t.rows.length > 1) t.rows.splice(Number(b.dataset.r), 1); }
  UI.follow = null;
  save(); renderWork();
  if (a === "addtable") { var ins = $("ws").querySelectorAll(".tname-in"); if (ins.length) ins[ins.length - 1].focus(); }
});
// While the solution is open, they type it: no pasting.
$("ws").addEventListener("paste", function(e){
  if (S.sol[S.i] && !S.done[S.i]) { e.preventDefault(); UI.note = "Paste is off while the solution is open. Type it: that is how it sticks."; renderStripNote(); }
});

/* ====================================================================
   Checking
   ==================================================================== */

function checkNow(){
  var idx = S.i, les = LESSONS[idx], ans = W(), msg = les.check(ans), key = JSON.stringify(ans), hadSol = !!S.sol[idx];
  S.checked[idx] = true; S.msg[idx] = msg; UI.note = "";
  if (!msg) {
    if (!S.done[idx]) { S.done[idx] = true; if (S.sol[idx]) S.usedSol[idx] = true; }
    S.sol[idx] = false;
  } else if (S.lastTried[idx] !== key && key !== JSON.stringify(les.start())) {
    S.lastTried[idx] = key; S.tries[idx] = (S.tries[idx] || 0) + 1;
  }
  save(); renderStrip(); renderDots();
  // What they type in keeps its focus; the rest redraws.
  if (les.kind === "confirm" || PREP || hadSol !== !!S.sol[idx]) renderWork();
}

/* ====================================================================
   Task strip
   ==================================================================== */

function renderDots(){
  var h = "";
  for (var i = 0; i < N; i++) h += '<button class="dot' + (S.done[i] ? (S.usedSol[i] ? " used" : " done") : "") + (i === S.i ? " cur" : "") + '" data-i="' + i + '" title="Task ' + (i + 1) + ": " + esc(LESSONS[i].title) + (S.usedSol[i] ? " (solved with the solution)" : "") + '"></button>';
  $("dots").innerHTML = h;
}
$("dots").addEventListener("click", function(e){ var d = e.target.closest("[data-i]"); if (d) gotoTask(Number(d.dataset.i)); });

function hintState(){
  var les = L(), shown = S.hints[S.i] || 0, tries = S.tries[S.i] || 0, len = les.hints.length;
  var nextAt = len === 0 ? 3 * TRIES_PER_HINT : (shown + 1) * TRIES_PER_HINT;
  return { shown: shown, tries: tries, len: len, need: Math.max(0, nextAt - tries), solutionNext: shown >= len };
}
function button(label, cls, fn){ var b = document.createElement("button"); b.className = cls; b.textContent = label; b.onclick = fn; return b; }

function renderStrip(){
  var les = L(), done = !!S.done[S.i], msg = S.msg[S.i], r = "";
  $("t-kicker").textContent = "Lesson D4 · Task " + (S.i + 1) + " of " + N + (les.extra ? " · Extra" : "") + (PREP ? (UI.prepView === "task" ? " · Prep: task" : " · Prep: sample") : "");
  $("t-title").textContent = les.title;
  $("t-do").innerHTML = les.do;
  $("t-sub").innerHTML = S.sol[S.i] && !done ? "The solution is above your work. Type it in, then <b>Check</b>." : les.sub;
  if (!S.checked[S.i] && !done) r = '<span class="dim">' + (les.kind === "confirm" ? "Tick the lines, then press <b>Check</b>." : "Fill it in, then press <b>Check</b> (or <kbd>Ctrl</kbd>+<kbd>Enter</kbd>).") + '</span>';
  else if (S.checked[S.i] && msg) r = '<span class="no">✗ Not yet.</span> ' + msg;
  else if (done) r = '<span class="yes">✓ Done.</span> ' + (les.after || "");
  $("t-result").innerHTML = r;
  var hs = hintState();
  if (hs.shown && les.hints.length) { $("t-hints").classList.remove("hidden"); $("t-hints").innerHTML = les.hints.slice(0, hs.shown).map(function(h, i){ return "<div><b>Hint " + (i + 1) + ":</b> " + h + "</div>"; }).join(""); }
  else $("t-hints").classList.add("hidden");
  var act = $("t-actions"); act.innerHTML = "";
  if (PREP) {
    act.appendChild(button("← Prev", "btn", function(){ gotoTask(S.i - 1); }));
    act.appendChild(button(UI.prepView === "task" ? "Show sample" : "Show task", "btn", togglePrep));
    act.appendChild(button("Next →", "btn primary", function(){ gotoTask(S.i + 1); }));
    return renderStripNote();
  }
  act.appendChild(button("Check", "btn primary", checkNow));
  if (done && !msg) { if (S.i < N - 1) act.appendChild(button("Next task →", "btn", function(){ gotoTask(S.i + 1); })); }
  else if (les.kind !== "confirm" && !S.sol[S.i] && !(les.noSol && hs.solutionNext)) act.appendChild(button(hs.solutionNext ? "Show solution" : (hs.len ? "Stuck? Hint" : "Stuck?"), "btn", stuck));
  renderStripNote();
}
function renderStripNote(){ var n = $("t-note"); n.classList.toggle("hidden", !UI.note); n.textContent = UI.note; }
function stuck(){
  var hs = hintState();
  if (hs.need > 0) {
    UI.note = "Have a go first: change something and press Check. Each different try counts. " + hs.need + " more and " + (hs.solutionNext ? "the solution" : "a hint") + " unlocks.";
    renderStripNote(); return;
  }
  UI.note = "";
  if (hs.solutionNext) { S.sol[S.i] = true; save(); renderAll(); return; }
  S.hints[S.i] = hs.shown + 1; save(); renderStrip();
}
// ?prep only: flip between the task's start and its sample.
function togglePrep(){
  UI.prepView = UI.prepView === "task" ? "solution" : "task";
  S.work[S.i] = UI.prepView === "task" ? L().start() : clone(L().solution);
  checkNow();
}

/* ====================================================================
   Moving between tasks
   ==================================================================== */

function gotoTask(i){
  S.i = Math.max(0, Math.min(N - 1, i)); UI.note = ""; UI.follow = null;
  if (PREP) { UI.prepView = "solution"; S.work[S.i] = clone(L().solution); renderAll(); checkNow(); return; }
  save(); renderAll();
}
function leftPanel(){ var les = L(); return les.story || les.left || (S.i === 0 ? HOWTO : myStoryPanel()); }
function renderAll(){
  renderDots(); renderStrip();
  $("story").innerHTML = leftPanel();
  renderWork();
}
$("l-again").onclick = function(){
  if (!confirm("Start this task again? What you wrote in this task is lost.")) return;
  S.work[S.i] = L().start(); S.checked[S.i] = false; S.msg[S.i] = ""; save(); gotoTask(S.i);
};
$("l-reset").onclick = function(){
  if (!confirm("Start the whole lesson again from task 1? Your work and progress are cleared.")) return;
  S = fresh(); S.primerDone = true; save(); gotoTask(0);
};
$("l-slides").onclick = function(){ primerIdx = 0; showPrimer(true); };

document.addEventListener("keydown", function(e){
  if (!$("primer").classList.contains("hidden")) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { primerIdx = Math.max(0, Math.min(PRIMER.length - 1, primerIdx + (e.key === "ArrowRight" ? 1 : -1))); renderPrimer(); }
    if (e.key === "N" && e.shiftKey) { showSay = !showSay; renderPrimer(); }
    return;
  }
  if (PREP && e.altKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); gotoTask(S.i + (e.key === "ArrowRight" ? 1 : -1)); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); checkNow(); }
});

/* ====================================================================
   Slides
   ==================================================================== */

function showPrimer(on){ $("primer").classList.toggle("hidden", !on); if (on) renderPrimer(); }
function renderPrimer(){
  var Pr = PRIMER[primerIdx], lastP = primerIdx === PRIMER.length - 1, dots = "";
  for (var i = 0; i < PRIMER.length; i++) dots += '<span class="pdot' + (i === primerIdx ? " cur" : "") + '" data-slide="' + i + '"></span>';
  $("primer").innerHTML = '<div class="slide">' +
    '<div class="kicker">' + LESSON + ' · ' + (primerIdx + 1) + ' of ' + PRIMER.length + '</div>' +
    '<h2>' + esc(Pr.title) + '</h2>' +
    '<div class="art">' + ART[Pr.art]() + '</div>' +
    '<p>' + Pr.body + '</p>' +
    (showSay ? '<div class="say"><b>Teacher:</b> ' + esc(Pr.say) + '</div>' : "") +
    '<div class="nav"><div class="pdots" id="pdots">' + dots + '</div>' +
    '<button class="btn" id="p-back"' + (primerIdx === 0 ? " disabled" : "") + '>← Back</button>' +
    '<button class="btn primary" id="p-next">' + (lastP ? "Let's go →" : "Next →") + '</button>' +
    (S.primerDone ? '<button class="btn" id="p-close">Close</button>' : "") + '</div>' +
    '<div class="keys">← → to move</div></div>';
  $("p-back").onclick = function(){ if (primerIdx > 0) { primerIdx--; renderPrimer(); } };
  $("p-next").onclick = function(){ if (!lastP) { primerIdx++; renderPrimer(); return; } S.primerDone = true; save(); showPrimer(false); };
  if ($("p-close")) $("p-close").onclick = function(){ showPrimer(false); };
  $("pdots").onclick = function(e){ var d = e.target.closest(".pdot"); if (d) { primerIdx = Number(d.dataset.slide); renderPrimer(); } };
}

// Test hook: lets an automated check run an answer against a task without the UI.
window.__D4 = { LESSONS: LESSONS, PRIMER: PRIMER, ART: ART, PREP: PREP, gotoTask: gotoTask, state: function(){ return S; },
  check: function(i, ans){ return LESSONS[i].check(ans); }, start: function(i){ return LESSONS[i].start(); }, solution: function(i){ return clone(LESSONS[i].solution); },
  rules: rules, targetOf: targetOf, hasFact: hasFact, follow: function(){ return $("follow") ? $("follow").textContent : ""; } };

document.title = LESSON;
showPrimer(!S.primerDone);
gotoTask(S.i);
})();
</script>
